# Builds the standalone Windows ColorBreakdown.exe on a GitHub-hosted Windows runner.
# Download it from the run's "Artifacts" section (Actions tab → latest run).
# Pushing a tag like v1.0 also attaches the .exe to a GitHub Release.
name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pillow numpy pyinstaller

      # Same PyInstaller call as build-windows.bat (minus the interactive pause).
      - name: Build ColorBreakdown.exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name ColorBreakdown
          --icon AppIcon.ico
          --add-data "AppIcon.png;."
          color_breakdown.py

      - uses: actions/upload-artifact@v4
        with:
          name: ColorBreakdown-windows
          path: windows/dist/ColorBreakdown.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: windows/dist/ColorBreakdown.exe
